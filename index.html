<script>
  // apply theme before first paint to avoid a flash
  try { var t = localStorage.getItem('sb-theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}
  // the Android status bar / title bar matches the app's surface colour
  try { var dk = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; document.getElementById('themeColor').content = dk ? '#171b22' : '#ffffff'; } catch (e) {}
  // touch devices (tablets) get bigger targets from the very first paint
  try { if (localStorage.getItem('sb-rail') === 'wide') document.documentElement.dataset.rail = 'wide'; } catch (e) {}
  try { var tm = localStorage.getItem('sb-touch') || 'auto'; if (tm === 'on' || (tm === 'auto' && matchMedia('(pointer: coarse)').matches)) document.documentElement.dataset.touch = '1'; } catch (e) {}
</script>
