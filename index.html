  // touch devices (tablets) get bigger targets from the very first paint
  try { if (localStorage.getItem('sb-rail') === 'wide') document.documentElement.dataset.rail = 'wide'; } catch (e) {}
  try { var tm = localStorage.getItem('sb-touch') || 'auto'; if (tm === 'on' || (tm === 'auto' && matchMedia('(pointer: coarse)').matches)) document.documentElement.dataset.touch = '1'; } catch (e) {}
